<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Усик – Дюбуа 2 | Пряма трансляція</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    html, body { height:100%; font-family:'Roboto',sans-serif; }
    body {
      background: url('https://javarush.ru/images/article/175c307b-2250-45db-9d7f-4f6ea1400c7c/original.png') center/cover no-repeat fixed;
      color:#fff; overflow-x:hidden; position: relative;
      min-height: 100vh;
    }
    body::after { content:''; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:0; pointer-events:none; }
    .wrapper { position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:40px 10px 28px; text-align:center; }

    .logo-container { display:flex; justify-content:center; align-items:center; gap:18px; margin-bottom:20px; }
    .logo-container img { width:64px; height:auto; filter:drop-shadow(0 2px 8px #000a);}
    .headline { font-size:2.2rem; color:#FFD700; font-weight:700; margin-bottom:10px; letter-spacing:1px; text-shadow:0 2px 8px #0008; }
    #countdown { font-size:1.1rem; color:#FFD700; margin-bottom:24px; letter-spacing:1px; }

    .fight-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      margin: 0 auto 18px;
      width: 100%;
      max-width: 900px;
      position: relative;
    }
    .fighter-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 130px;
      max-width: 170px;
      width: 18vw;
      position: relative;
      z-index: 2;
    }
    .fighter-pic img {
      width: 100%;
      max-width: 160px;
      height: 210px;
      border-radius: 18px;
      box-shadow: 0 0 22px #000c, 0 1px 24px #ffd70042;
      object-fit: cover;
      background: #101820;
      border:3px solid #ffd700b7;
    }
    .fighter-name {
      margin-top: 12px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #FFD700;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px #0009;
    }
    .koef-block {
      margin-top: 10px;
      margin-bottom: 4px;
      width: 98px;
      text-align: center;
    }
    .koef-link {
      display:inline-block;
      width:100%;
      padding:9px 0;
      font-size:1.1rem;
      font-weight:700;
      border-radius: 11px;
      background:linear-gradient(90deg,#FFD700 80%,#E4C200 100%);
      color:#141414;
      box-shadow:0 2px 10px #ffd70055;
      text-decoration:none;
      border:2px solid #141414;
      letter-spacing:1px;
      transition:.18s;
      position: relative;
      z-index: 3;
      outline: none;
    }
    .koef-link:hover, .koef-link:focus {
      background:linear-gradient(90deg,#fff700,#FFD700 60%);
      color:#000;
      border-color:#FFD700;
      transform: scale(1.07);
      box-shadow:0 2px 18px #ffd700bb, 0 0 8px #fff50099;
    }

    .video-window {
      flex: 1 1 480px;
      background:linear-gradient(135deg,#1e3c72,#2a5298);
      border:2px solid #ffd900e8;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 8px 22px #000c;
      min-width: 0;
      min-height:320px;
      position: relative;
      aspect-ratio: 16 / 9;
      max-width: 620px;
      margin: 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-window video {
      width:100%; height:100%; display:block; object-fit:cover; filter: blur(10px) brightness(0.43);
    }
    .video-overlay {
      position:absolute; inset:0; background:rgba(0,0,0,0.77);
      display:flex; justify-content:center; align-items:center;
    }
    .play-icon {
      font-size:6rem; color:#FFD700; cursor:pointer; animation:pulse 2s infinite; filter:drop-shadow(0 0 16px #ffd700a2);
      transition:transform .18s;
    }
    .play-icon:active { transform: scale(1.13);}
    .small-note { font-size:0.97rem; color:rgba(255,255,255,0.56); margin-bottom:2px; }
    .footer { margin-top:34px; font-size:0.99rem; opacity:0.81; }
    .decor, .decor2 { display:none;}

    /* Modal */
    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.96); display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden; transition:opacity .28s; z-index:5; }
    .modal-bg.show { opacity:1; visibility:visible; }
    .modal {
      position:relative; background:#181818; padding:22px 9px 20px;
      border-radius:12px; width:98%; max-width:470px; text-align:center; box-shadow:0 8px 26px #000d;
    }
    .modal h2 { font-size:1.23rem; color:#FFD700; margin:0 0 12px; }
    .modal-btn { display:block; margin:13px auto 0; padding:15px 0; width:100%; background:#FF4500; color:#fff; border-radius:8px; font-weight:700; font-size:1.12rem; text-decoration:none; box-shadow:0 4px 14px #0008; letter-spacing:.6px; transition:background .23s;}
    .modal-btn:hover { background:#FF8C00; }
    .close-btn { position:absolute; top:10px; right:17px; font-size:1.19rem; color:#fff; cursor:pointer; }
    .modal-trust { margin-top:16px; font-size:1.03rem; color:#0ff; }
    @keyframes pulse { 0%,100%{transform:scale(1);}50%{transform:scale(1.09);} }

    /* Responsive styles */
    @media(max-width:900px){
      .wrapper { padding-top:22px;}
      .fight-row { gap:10px;}
      .fighter-col { max-width:98px; min-width:76px;}
      .fighter-pic img { max-width:90px; height:120px; }
      .video-window { max-width: 95vw; min-height:160px;}
      .koef-block { width:80px; }
      .koef-link { font-size:1rem; }
    }
    @media(max-width:650px){
      .fight-row { flex-direction:column; gap:0; align-items:stretch;}
      .fighter-col {
        order:1;
        margin:0 auto 9px;
        width:90px; max-width:90px; min-width:70px;
      }
      .fighter-col.right { order:3; margin-top:9px;}
      .video-window { order:2; min-height:150px; border-radius:10px;}
      .fighter-name { font-size:0.95rem; }
      .koef-block { margin-top:8px; }
    }
    @media(max-width:440px){
      .headline { font-size:1.07rem;}
      .logo-container img {width:34px;}
      .modal {padding:10px 2px;}
      .modal-btn {font-size:0.99rem;}
      .modal-trust{font-size:0.97rem;}
      .footer{font-size:0.88rem;}
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="logo-container">
      <img src="https://igrovi-avtomati.com.ua/media/parik24.png" alt="PARIK24">
      <img src="https://www.instalki.pl/wp-content/uploads/program/icons/M/1d2786039dcc545cccf678a1f4fe95c4unnamed.png" alt="Megogo">
    </div>
    <h1 class="headline">Усик — Дюбуа 2 <span style="font-size:1.1rem; color:#fff; font-weight:400; letter-spacing:0;">| Пряма трансляція</span></h1>
    <div id="countdown">Трансляція доступна: <span id="timer"></span></div>
    
    <div class="fight-row">
      <!-- Усик слева -->
      <div class="fighter-col left">
        <div class="fighter-pic">
          <img src="https://dynamo.kiev.ua/media/posts/2023/12/18/7.jpg" alt="Олександр Усик" loading="lazy">
        </div>
        <div class="fighter-name">Усик</div>
        <div class="koef-block">
          <a href="https://track.smartlink-gh.site/sl?id=687a0b103913fc6f4740965e&pid=3751&sub1=link1" class="koef-link" target="_blank">Коеф: х1.36</a>
        </div>
      </div>
      <div class="video-window">
        <video id="videoElm" style="width:100%;height:100%;" poster="https://i.imgur.com/w3F4F7G.jpeg" muted></video>
        <div class="video-overlay">
          <div class="play-icon" id="playBtn">▶️</div>
        </div>
      </div>
      <!-- Дюбуа справа -->
      <div class="fighter-col right">
        <div class="fighter-pic">
          <img src="https://i.dailymail.co.uk/1s/2024/09/20/18/89921213-13874489-image-a-36_1726855165836.jpg" alt="Дюбуа" loading="lazy">
        </div>
        <div class="fighter-name">Дюбуа</div>
        <div class="koef-block">
          <a href="https://track.smartlink-gh.site/sl?id=687a0b103913fc6f4740965e&pid=3751&sub1=link1" class="koef-link" target="_blank">Коеф: х3.94</a>
        </div>
      </div>
    </div>

    <p class="small-note">Дивись безкоштовно — натисни ▶️</p>
    <div class="footer">PARIK 24 — офіційний партнер. Всі права захищено.</div>
  </div>

  <div class="modal-bg" id="modal">
    <div class="modal">
      <span class="close-btn" id="closeModal">✖</span>
      <div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:10px;margin-bottom:13px;">
        <iframe src="https://www.youtube.com/embed/9e1jO69dtic?si=RzVa0B9StyNCnZ0q"
          style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;" 
          allow="autoplay; encrypted-media; fullscreen" allowfullscreen>
        </iframe>
      </div>
      <h2>Щоб отримати доступ, зробіть ставку</h2>
      <a href="https://track.smartlink-gh.site/sl?id=687a0b103913fc6f4740965e&pid=3751&sub1=link1" class="modal-btn" target="_blank">💰 Зробити ставку</a>
      <div class="modal-trust">🔒 Безпечні платежі · 💯 Гарантія виплат · ⭐ Рейтинг 4.8/5</div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Таймер (киевское время)
      const timerEl = document.getElementById('timer');
      function updateTimer() {
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const kyivTime = new Date(utc + 3 * 3600000);
        const midnight = new Date(kyivTime);
        midnight.setHours(24, 0, 0, 0);
        let diff = Math.floor((midnight - kyivTime) / 1000);
        diff = diff > 0 ? diff : 0;
        const h = String(Math.floor(diff / 3600)).padStart(2, '0');
        const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
        const s = String(diff % 60).padStart(2, '0');
        timerEl.textContent = `${h}:${m}:${s}`;
      }
      updateTimer();
      setInterval(updateTimer, 1000);

      // Modal
      const playBtn = document.getElementById('playBtn');
      const modal = document.getElementById('modal');
      const closeBtn = document.getElementById('closeModal');
      playBtn.addEventListener('click', () => modal.classList.add('show'));
      closeBtn.addEventListener('click', () => modal.classList.remove('show'));
    });
  </script>
</body>
</html>
